<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Nohemi;src:url('../fonts/Nohemi-Bold.ttf');font-weight:700}
@font-face{font-family:Barlow;src:url('https://cdn.jsdelivr.net/npm/@fontsource/barlow@5.0.13/files/barlow-latin-500-normal.woff2');font-weight:500}
@font-face{font-family:Barlow;src:url('https://cdn.jsdelivr.net/npm/@fontsource/barlow@5.0.13/files/barlow-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:'Barlow Condensed';src:url('https://cdn.jsdelivr.net/npm/@fontsource/barlow-condensed@5.0.13/files/barlow-condensed-latin-500-normal.woff2');font-weight:500}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:#0A0F1A;font-family:Barlow,sans-serif;color:#0A0F1A}
.photo{position:absolute;inset:0;background:url('og-photo-hero-church.jpg') 0% 38%/135% auto}
.shade{position:absolute;left:0;right:0;top:0;height:170px;background:linear-gradient(to bottom,rgba(10,15,26,.45),rgba(10,15,26,0))}
.frame{position:absolute;inset:22px;border:1.5px solid rgba(255,255,255,.75);border-radius:30px}
.tag{position:absolute;left:56px;top:50px;font-family:'Barlow Condensed';font-weight:500;font-size:20px;letter-spacing:3px;color:#fff}
.logo{position:absolute;right:52px;top:44px;height:40px}
svg.shape{position:absolute;inset:0}
h1{position:absolute;left:56px;bottom:56px;margin:0;font-family:Nohemi;font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-0.03em;color:#fff;max-width:620px}
h1 span{color:#D1FF42}
.fade{position:absolute;inset:0;background:linear-gradient(to right,rgba(10,15,26,.82),rgba(10,15,26,.45) 52%,rgba(10,15,26,0) 72%),linear-gradient(to top,rgba(10,15,26,.9),rgba(10,15,26,.6) 50%,rgba(10,15,26,0))}
</style></head><body>
<div class="photo"></div><div class="fade"></div><div class="shade"></div><div class="frame"></div>
<span class="tag">#PASSITON</span>
<img class="logo" src="../brand/sfm-logo-lime-on-dark.svg">
<h1>Every friend of Mary is a stranger <span>we cannot wait to pray for, care for, and gather with.</span></h1>
</body></html>
